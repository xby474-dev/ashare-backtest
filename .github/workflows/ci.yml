name: Reproducibility checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.19'
          enable-cache: false
      - name: Install fixed Python interpreter
        run: uv python install 3.12.14
      - name: Restore locked core environment
        run: uv sync --locked
      - name: Run unit and integration tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Run synthetic research example
        run: uv run --no-sync python -m ashare demo --research --output outputs/demo
      - name: Reconcile accounts and verify deterministic replay
        run: uv run --no-sync python tools/verify_demo.py --replay
